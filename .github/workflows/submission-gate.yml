name: ROBO BRIDGE submission gate

on:
  push:
    branches:
      - oracle/p0-submission-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submission-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Select Chromium browser
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium browser was found." >&2
            exit 1
          fi
          echo "ROBO_BRIDGE_BROWSER=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Run submission gate
        id: gate
        continue-on-error: true
        run: npm run submission:gate

      - name: Upload submission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robo-bridge-submission-evidence-${{ github.run_id }}
          path: |
            artifacts/submission-evidence/
            dist/ROBO_BRIDGE_MCP_MAIN_DEMO.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce gate result
        if: steps.gate.outcome != 'success'
        run: exit 1
