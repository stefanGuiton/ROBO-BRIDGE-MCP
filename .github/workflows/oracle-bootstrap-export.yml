name: Oracle bootstrap export

on:
  push:
    branches:
      - oracle/mega-merge-p0-v1
    paths:
      - .github/workflows/oracle-bootstrap-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Oracle branches
        run: |
          git fetch origin \
            oracle/bridge-core-main-demo-v1:refs/remotes/origin/oracle/bridge-core-main-demo-v1 \
            oracle/webmcp-bridge-design-v1:refs/remotes/origin/oracle/webmcp-bridge-design-v1
      - name: Create source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap
          tar --exclude=.git --exclude=bootstrap -czf bootstrap/repository.tar.gz .
          git archive --format=tar.gz --output=bootstrap/bridge-core-branch.tar.gz \
            origin/oracle/bridge-core-main-demo-v1 ORACLE_BRIDGE_CORE_MAIN_DEMO_V1
          git archive --format=tar.gz --output=bootstrap/webmcp-design-branch.tar.gz \
            origin/oracle/webmcp-bridge-design-v1 ORACLE_WEBMCP_BRIDGE_DESIGN_V1
          printf '%s\n' "$(git rev-parse HEAD)" > bootstrap/exported-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-bootstrap-export
          path: bootstrap
          if-no-files-found: error
          retention-days: 1
