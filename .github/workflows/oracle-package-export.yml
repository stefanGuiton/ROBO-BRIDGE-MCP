name: Oracle Package Export

on:
  push:
    branches:
      - oracle/mega-merge-p0-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: oracle/mega-merge-p0-v1
          fetch-depth: 0
          lfs: false
      - name: Fetch accepted Oracle checkpoints
        run: |
          git fetch origin \
            oracle/bridge-core-main-demo-v1 \
            oracle/webmcp-bridge-design-v1
      - name: Extract bridge core and WebMCP packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-export/bridge-core /tmp/oracle-export/webmcp-design
          for part in 00 01 02 03 04; do
            git show "origin/oracle/bridge-core-main-demo-v1:ORACLE_BRIDGE_CORE_MAIN_DEMO_V1/archive/oracle_bridge_core_no_png.tar.gz.b64.part${part}"
          done > /tmp/bridge-core.tar.gz.b64
          base64 -d /tmp/bridge-core.tar.gz.b64 > /tmp/bridge-core.tar.gz
          tar -xzf /tmp/bridge-core.tar.gz -C /tmp/oracle-export/bridge-core
          git archive --format=tar origin/oracle/webmcp-bridge-design-v1 ORACLE_WEBMCP_BRIDGE_DESIGN_V1 \
            | tar -xf - -C /tmp/oracle-export/webmcp-design
          find /tmp/oracle-export -maxdepth 5 -type f | sort > /tmp/oracle-export/FILES.txt
      - name: Upload accepted package sources
        uses: actions/upload-artifact@v4
        with:
          name: accepted-oracle-packages
          path: /tmp/oracle-export
          if-no-files-found: error
